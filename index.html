<style>
:root{--brown:#4b2417;--gold:#c9972f;--cream:#f7f0e5;--green:#166534;--red:#b42318}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:linear-gradient(180deg,#f8f2e8,#efe2cf);color:#2e211b;min-height:100vh}
header{background:var(--brown);color:white;text-align:center;padding:20px 14px 24px;border-bottom:5px solid var(--gold)}
.logo{width:155px;height:110px;object-fit:contain;background:white;border-radius:18px;padding:8px;box-shadow:0 8px 22px #0004}
h1{margin:10px 0 5px;font-size:25px} header p{margin:0;color:#f3dfb2}
main{max-width:620px;margin:auto;padding:16px}
.card{background:#fff;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 8px 25px #4b24171b;border:1px solid #e8dac7}
.primary,.secondary,.search-btn{border:0;border-radius:13px;padding:14px;font-size:17px;font-weight:700;cursor:pointer}
.primary{width:100%;background:var(--gold);color:#2d1a0f}
.secondary{display:none;width:100%;margin-top:10px;background:#eee5d8;color:var(--brown)}
.search-row{display:flex;gap:8px}
input{flex:1;min-width:0;border:1px solid #ccbda8;border-radius:13px;padding:14px;font-size:18px;text-align:center;direction:ltr}
.search-btn{width:90px;background:var(--brown);color:white}
#reader{display:none;margin-top:15px;overflow:hidden;border-radius:14px;background:#111}#video{width:100%;display:block;max-height:420px;object-fit:cover}
.message{display:none;border-radius:14px;padding:14px;text-align:center;margin:12px 0}
.error{display:block;background:#fff0f0;color:var(--red);border:1px solid #ffd0d0}
.loading{display:block;background:#fff7dd;color:#73550c}
.result{display:none;text-align:center}
.label{color:#7a6a5f;font-size:14px}
.name{font-size:24px;font-weight:800;margin:10px 0}
.price{font-size:44px;color:var(--green);font-weight:900;margin:10px 0}
.barcode{direction:ltr;color:#71655e;font-family:monospace;font-size:16px}
.tax{margin-top:8px;color:#776b63}
.hint{font-size:13px;color:#756a62;text-align:center;line-height:1.7}
footer{text-align:center;color:#7b6b60;padding:15px 10px 28px;font-size:13px}
</style>
</head>

<header>

<h1>محمص وبن دثار</h1>

</header>
<main>
<section class="card">

</section>

<section class="card">
<div class="search-row">
<input id="codeInput" inputmode="numeric" autocomplete="off" placeholder="أدخل رقم الباركود">
<button class="search-btn" onclick="findByInput()">بحث</button>
</div>
<p class="hint">يمكن كتابة رقم الباركود يدويًا إذا تعذر تشغيل الكاميرا.</p>
</section>

<div id="message" class="message"></div>

<section id="result" class="card result">
<div class="label">اسم المادة</div>
<div id="pname" class="name"></div>
<div id="pprice" class="price"></div>
<div id="pbarcode" class="barcode"></div>
<div id="ptax" class="tax"></div>
</section>
</main>
<footer>الأسعار مرتبطة بآخر نسخة من ملف المنتجات المرفوع إلى الموقع.</footer>

let codeReader=null;
let controls=null;

function norm(v){return String(v??'').trim().replace(/\D/g,'')}
function message(text,type='error'){
 const el=document.getElementById('message');
 el.textContent=text; el.className='message '+type; el.style.display='block';
}
function clearMessage(){document.getElementById('message').style.display='none'}
function findProduct(code){
 code=norm(code);
 if(!code){message('أدخل رقم الباركود أولًا.');return}
 const p=products.find(x=>norm(x.barcode)===code);
 if(!p){document.getElementById('result').style.display='none';message('لم يتم العثور على هذا الباركود في قائمة الأسعار.');return}
 clearMessage();
 document.getElementById('pname').textContent=p.name;
 document.getElementById('pprice').textContent=Number(p.price).toFixed(2)+' دينار';
 document.getElementById('pbarcode').textContent='الباركود: '+p.barcode;
 document.getElementById('ptax').textContent=(p.tax!==null&&p.tax!==undefined&&p.tax!=='')?'الضريبة: '+p.tax+'%':'';
 document.getElementById('result').style.display='block';
 document.getElementById('result').scrollIntoView({behavior:'smooth',block:'center'});
}
function findByInput(){findProduct(document.getElementById('codeInput').value)}

async function startScanner(){
 if(controls) return;
 clearMessage();
 const reader=document.getElementById('reader');
 const video=document.getElementById('video');
 reader.style.display='block';
 document.getElementById('stopBtn').style.display='block';

 if(!window.ZXingBrowser){
   message('تعذر تحميل مكتبة ZXing. تحقق من اتصال الإنترنت ثم حدّث الصفحة.');
   return;
 }

 try{
   codeReader = new ZXingBrowser.BrowserMultiFormatReader();
   const devices = await ZXingBrowser.BrowserCodeReader.listVideoInputDevices();

   if(!devices || !devices.length){
     throw new Error('لا توجد كاميرا');
   }

   const backCamera =
     devices.find(d => /back|rear|environment|خلف/i.test(d.label)) ||
     devices[devices.length - 1];

   controls = await codeReader.decodeFromVideoDevice(
     backCamera.deviceId,
     video,
     (result, error) => {
       if(result){
         findProduct(result.getText());
         stopScanner();
       }
     }
   );
 }catch(e){
   reader.style.display='none';
   document.getElementById('stopBtn').style.display='none';
   controls=null;
   codeReader=null;
   message('تعذر تشغيل الكاميرا. افتح الموقع في Chrome أو Safari واسمح باستخدام الكاميرا.');
 }
}
async function stopScanner(){
 try{
   if(controls){
     controls.stop();
   }
 }catch(e){}
 controls=null;
 codeReader=null;
 const video=document.getElementById('video');
 if(video && video.srcObject){
   video.srcObject.getTracks().forEach(track=>track.stop());
   video.srcObject=null;
 }
 document.getElementById('reader').style.display='none';
 document.getElementById('stopBtn').style.display='none';
}
document.getElementById('photoInput').addEventListener('change', async function(e){
 const file=e.target.files && e.target.files[0];
 if(!file) return;

 clearMessage();
 message('جاري قراءة صورة الباركود...','loading');

 if(!window.ZXingBrowser){
   message('تعذر تحميل مكتبة ZXing. تحقق من الإنترنت ثم أعد فتح الصفحة.');
   return;
 }

 const img = new Image();
 const objectUrl = URL.createObjectURL(file);

 try{
   img.src = objectUrl;
   await img.decode();

   const imageReader = new ZXingBrowser.BrowserMultiFormatReader();
   const result = await imageReader.decodeFromImageElement(img);

   URL.revokeObjectURL(objectUrl);
   findProduct(result.getText());
 }catch(err){
   URL.revokeObjectURL(objectUrl);
   message('لم أتمكن من قراءة الباركود من الصورة. اجعل الباركود واضحًا ومضاءً ويملأ معظم الصورة.');
 }

 e.target.value='';
});

document.getElementById('codeInput').addEventListener('keydown',e=>{if(e.key==='Enter')findByInput()});
